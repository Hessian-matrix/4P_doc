# Read the Docs configuration for the English build.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
#
# The English documentation is published as a separate Read the Docs project
# linked to the Chinese project as a translation; the two projects share this
# repository but point to different Sphinx configuration files.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: source/en/conf.py

python:
  install:
    - requirements: source/requirements.txt
